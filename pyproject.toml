[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-lint"
version = "0.2.0"
description = "AgenticLint: Production-grade multi-agent pull request reviewer built on Claude, LangGraph, MCP, and FastAPI."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AgenticLint Contributors" }]
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "mcp>=2.2,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "aiofiles>=23.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.15.11"]

[project.scripts]
review-agent = "review_agent.cli:main"
review-agent-mcp = "review_agent.mcp_server:main"
agenticlint = "review_agent.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/review_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 110
target-version = "py311"
